<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiitos — Achievement Unlocked</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(ellipse at center, #FF8C42 0%, #FF6B35 50%, #E55A2B 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Floating background sparkles */
        .bg-sparkle {
            position: absolute;
            color: rgba(255, 255, 255, 0.18);
            font-size: clamp(20px, 2.5vw, 32px);
            pointer-events: none;
            animation: drift 8s ease-in-out infinite;
        }
        .bg-sparkle:nth-child(1) { top: 12%; left: 8%; animation-delay: 0s; }
        .bg-sparkle:nth-child(2) { top: 78%; left: 12%; animation-delay: 1.5s; }
        .bg-sparkle:nth-child(3) { top: 18%; right: 10%; animation-delay: 3s; }
        .bg-sparkle:nth-child(4) { top: 70%; right: 14%; animation-delay: 4.5s; }
        .bg-sparkle:nth-child(5) { top: 40%; left: 5%; animation-delay: 2s; }
        .bg-sparkle:nth-child(6) { top: 50%; right: 6%; animation-delay: 5s; }
        @keyframes drift {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.18; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.35; }
        }

        /* Achievement-unlocked banner */
        .achievement-banner {
            background: rgba(255, 255, 255, 0.96);
            color: #FF6B35;
            padding: 12px 38px;
            border-radius: 50px;
            font-size: clamp(0.75rem, 1.1vw, 1rem);
            font-weight: 800;
            letter-spacing: clamp(2px, 0.4vw, 4px);
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: clamp(20px, 3.5vh, 36px);
            opacity: 0;
            transform: translateY(-20px) scale(0.9);
            animation: bannerPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .achievement-banner::before {
            content: '🏆';
            font-size: clamp(1.2rem, 1.8vw, 1.6rem);
        }
        @keyframes bannerPop {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* The KIITOS letters container */
        .kiitos-wrap {
            display: flex;
            gap: clamp(8px, 1.5vw, 18px);
            align-items: baseline;
            position: relative;
        }

        .letter {
            font-family: 'Didot', 'Bodoni MT', 'Bodoni 72', Georgia, 'Times New Roman', serif;
            font-style: italic;
            font-weight: 900;
            font-size: clamp(5rem, 16vw, 17rem);
            color: white;
            line-height: 0.9;
            text-shadow:
                0 6px 25px rgba(0, 0, 0, 0.22),
                0 2px 4px rgba(0, 0, 0, 0.15);
            display: inline-block;
            opacity: 0;
            transform: translateY(80px) rotate(-8deg) scale(0.5);
            animation: letterDrop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .letter:nth-child(1) { animation-delay: 1.0s; }
        .letter:nth-child(2) { animation-delay: 1.18s; }
        .letter:nth-child(3) { animation-delay: 1.36s; }
        .letter:nth-child(4) { animation-delay: 1.54s; }
        .letter:nth-child(5) { animation-delay: 1.72s; }
        .letter:nth-child(6) { animation-delay: 1.90s; }
        @keyframes letterDrop {
            0% { opacity: 0; transform: translateY(80px) rotate(-8deg) scale(0.5); }
            60% { opacity: 1; transform: translateY(-15px) rotate(2deg) scale(1.1); }
            100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
        }

        /* Pulse on each letter after they all land */
        .letter.pulse {
            animation: letterPulse 0.5s ease 0.1s;
        }
        @keyframes letterPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        /* XP counter */
        .xp-bar {
            margin-top: clamp(20px, 3.5vh, 36px);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.18);
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            opacity: 0;
            transform: translateY(20px);
            animation: xpFadeIn 0.8s ease 2.4s forwards;
            font-weight: 700;
            font-size: clamp(0.95rem, 1.4vw, 1.25rem);
            letter-spacing: 1px;
        }
        @keyframes xpFadeIn { to { opacity: 1; transform: translateY(0); } }

        .xp-label { color: rgba(255, 255, 255, 0.85); }
        .xp-value {
            color: white;
            font-size: clamp(1.3rem, 2vw, 1.8rem);
            font-weight: 900;
            min-width: 4ch;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Burst sparkles around the letters when they land */
        .burst {
            position: absolute;
            font-size: clamp(20px, 2.5vw, 36px);
            color: white;
            pointer-events: none;
            opacity: 0;
            animation: burstOut 1.2s ease 2.0s forwards;
        }
        .burst:nth-child(1) { top: 20%; left: 10%; }
        .burst:nth-child(2) { top: 15%; right: 12%; animation-delay: 2.1s; }
        .burst:nth-child(3) { bottom: 15%; left: 18%; animation-delay: 2.2s; }
        .burst:nth-child(4) { bottom: 20%; right: 15%; animation-delay: 2.3s; }
        .burst:nth-child(5) { top: 50%; left: -8%; animation-delay: 2.15s; }
        .burst:nth-child(6) { top: 50%; right: -8%; animation-delay: 2.25s; }
        @keyframes burstOut {
            0% { opacity: 0; transform: scale(0.3) rotate(0deg); }
            40% { opacity: 1; transform: scale(1.3) rotate(180deg); }
            100% { opacity: 0; transform: scale(0.6) rotate(360deg) translateY(-30px); }
        }

        .utu-text-mark {
            position: absolute;
            bottom: clamp(20px, 3vh, 32px);
            right: clamp(20px, 3vw, 32px);
            text-align: right;
            color: rgba(255, 255, 255, 0.95);
            font-family: 'Segoe UI', Arial, sans-serif;
            opacity: 0;
            animation: fadeIn 1s ease 3.0s forwards;
            z-index: 5;
            line-height: 1.1;
        }
        .utu-text-mark .utu-line1 {
            display: block;
            font-size: clamp(0.75rem, 1.1vw, 0.95rem);
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.85;
        }
        .utu-text-mark .utu-line2 {
            display: block;
            font-size: clamp(1.05rem, 1.6vw, 1.4rem);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <!-- Background sparkles -->
    <div class="bg-sparkle">✦</div>
    <div class="bg-sparkle">✧</div>
    <div class="bg-sparkle">✦</div>
    <div class="bg-sparkle">✧</div>
    <div class="bg-sparkle">✦</div>
    <div class="bg-sparkle">✧</div>

    <div class="achievement-banner">Achievement Unlocked</div>

    <div class="kiitos-wrap">
        <span class="burst">✨</span>
        <span class="burst">⭐</span>
        <span class="burst">✨</span>
        <span class="burst">⭐</span>
        <span class="burst">✨</span>
        <span class="burst">⭐</span>
        <span class="letter">K</span>
        <span class="letter">i</span>
        <span class="letter">i</span>
        <span class="letter">t</span>
        <span class="letter">o</span>
        <span class="letter">s</span>
    </div>

    <div class="xp-bar">
        <span class="xp-label">+</span>
        <span class="xp-value" id="xp">0</span>
        <span class="xp-label">XP &nbsp;·&nbsp; LEVEL UP</span>
    </div>

    <div class="utu-text-mark">
        <span class="utu-line1">University of</span>
        <span class="utu-line2">TURKU</span>
    </div>

    <script>
        // XP counter that rolls up to 500 after letters land
        function rollXP() {
            const el = document.getElementById('xp');
            if (!el) return;
            const target = 500;
            const duration = 1400;
            const start = performance.now();
            function tick(now) {
                const t = Math.min(1, (now - start) / duration);
                // Ease-out cubic
                const eased = 1 - Math.pow(1 - t, 3);
                el.textContent = Math.floor(target * eased);
                if (t < 1) requestAnimationFrame(tick);
                else el.textContent = target;
            }
            requestAnimationFrame(tick);
        }

        function startAnimation() {
            // Restart all CSS animations by reloading the relevant elements
            document.querySelectorAll('.letter, .achievement-banner, .xp-bar, .burst, .utu-text-mark').forEach(el => {
                el.style.animation = 'none';
                el.offsetHeight; // reflow
                el.style.animation = '';
            });
            // XP starts after the letters have landed (~2.5s)
            setTimeout(rollXP, 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(rollXP, 2500);
        });

        window.addEventListener('message', function(event) {
            if (event.data === 'slideActive') {
                startAnimation();
            }
        });
    </script>
</body>
</html>
